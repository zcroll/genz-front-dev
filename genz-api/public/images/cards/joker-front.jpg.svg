<svg width="250" height="350" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="250" height="350" rx="15" fill="#fff" />
  <rect x="10" y="10" width="230" height="330" rx="10" fill="#fff" stroke="#000" stroke-width="1" />
  
  <!-- Joker text -->
  <text x="30" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#b91c1c">J</text>
  <text x="220" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#b91c1c" text-anchor="end">J</text>
  
  <!-- Joker face -->
  <circle cx="125" cy="150" r="60" fill="#fff" stroke="#000" stroke-width="2" />
  <circle cx="105" cy="130" r="8" fill="#000" /> <!-- Left eye -->
  <circle cx="145" cy="130" r="8" fill="#000" /> <!-- Right eye -->
  <path d="M105 180 Q125 200 145 180" fill="none" stroke="#000" stroke-width="3" /> <!-- Smile -->
  <path d="M85 100 L115 120 M165 100 L135 120" fill="none" stroke="#b91c1c" stroke-width="3" /> <!-- Hat -->
  
  <!-- Joker text -->
  <text x="125" y="240" font-family="Arial" font-size="24" font-weight="bold" fill="#b91c1c" text-anchor="middle">JOKER</text>
  
  <!-- Card corners -->
  <text x="30" y="320" font-family="Arial" font-size="24" font-weight="bold" fill="#b91c1c">★</text>
  <text x="220" y="320" font-family="Arial" font-size="24" font-weight="bold" fill="#b91c1c" text-anchor="end">★</text>
</svg>
