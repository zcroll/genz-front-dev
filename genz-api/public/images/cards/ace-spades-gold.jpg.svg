<svg width="250" height="350" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="250" height="350" rx="15" fill="#fff" />
  <rect x="10" y="10" width="230" height="330" rx="10" fill="#fffbeb" stroke="#b59410" stroke-width="2" />
  <text x="30" y="50" font-family="Arial" font-size="24" font-weight="bold">A</text>
  <text x="220" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="end">A</text>
  
  <!-- Gold foil effect on spades -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#b59410" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  
  <path d="M125 100 L145 140 L125 180 L105 140 Z" fill="url(#goldGradient)" />
  <path d="M125 180 L145 220 L125 260 L105 220 Z" fill="url(#goldGradient)" />
  
  <text x="30" y="320" font-family="Arial" font-size="24" font-weight="bold" fill="#b59410">♠</text>
  <text x="220" y="320" font-family="Arial" font-size="24" font-weight="bold" fill="#b59410" text-anchor="end">♠</text>
  <text x="125" y="175" font-family="Arial" font-size="18" fill="#b59410" text-anchor="middle">ACE OF SPADES</text>
  <text x="125" y="300" font-family="Arial" font-size="14" fill="#b59410" text-anchor="middle">LUXURY GOLD</text>
</svg>
